<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Poke Multi Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121214; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .toolbar { display: flex; gap: 10px; padding: 10px; background: #202024; align-items: center; }
    button { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #4338ca; }

    .grid-container { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; flex: 1; gap: 4px; padding: 4px; background: #000; }
    .card { position: relative; width: 100%; height: 100%; background: #18181b; }
    webview { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="toolbar">
    <button onclick="recarregarTodas()">Recarregar Todas</button>
  </div>

  <div class="grid-container">
    <div class="card"><webview id="view1" src="https://pokeidle.net" partition="persist:acc1"></webview></div>
    <div class="card"><webview id="view2" src="https://pokeidle.net" partition="persist:acc2"></webview></div>
    <div class="card"><webview id="view3" src="https://pokeidle.net" partition="persist:acc3"></webview></div>
    <div class="card"><webview id="view4" src="https://pokeidle.net" partition="persist:acc4"></webview></div>
  </div>

  <script>
    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        const wv = document.getElementById(`view${i}`);
        if (wv) wv.reload();
      }
    }
  </script>
</body>
</html>
