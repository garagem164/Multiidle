<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Idle Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Barra de Ferramentas Responsiva */
    .top-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      align-items: center;
      flex-wrap: wrap;
    }

    .top-bar input {
      flex: 1 1 180px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      min-width: 0;
    }

    .top-bar select {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #0066cc;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover { background: #0052a3; }
    .btn-secondary { background: #333; border: 1px solid #555; }
    .btn-secondary:hover { background: #444; }

    /* Grid Responsivo das Telas */
    .grid-container {
      display: grid;
      flex: 1;
      gap: 4px;
      padding: 4px;
      width: 100%;
      height: 100%;
      /* Padrão Inicial: 4 Telas (2x2) */
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }

    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      min-width: 0;
      min-height: 0;
    }

    /* Esconde painéis inativos */
    .panel.hidden {
      display: none !important;
    }

    .panel-bar {
      display: flex;
      background-color: #181818;
      padding: 3px 4px;
      gap: 4px;
      align-items: center;
      z-index: 10;
    }

    .panel-bar input {
      flex: 1;
      background: #2b2b2b;
      border: 1px solid #333;
      color: #ccc;
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 10px;
      min-width: 0;
    }

    .btn-sm {
      padding: 2px 6px;
      font-size: 10px;
    }

    /* Container para permitir o viewport virtual sem barras de rolagem */
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Ajuste de escala para o jogo carregar em tamanho ideal */
    iframe {
      width: 150%;
      height: 150%;
      border: none;
      background: #fff;
      transform: scale(0.6666);
      transform-origin: 0 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="globalUrl" value="https://poke.idleworld.online/login" placeholder="Digite uma URL para todas...">
    
    <select id="screenSelect" onchange="alterarQuantidadeTelas(this.value)">
      <option value="1">1 Tela</option>
      <option value="2">2 Telas</option>
      <option value="4" selected>4 Telas</option>
    </select>

    <div class="btn-group">
      <button class="btn" onclick="carregarTodas()">Abrir em Todas</button>
      <button class="btn btn-secondary" onclick="recarregarTodas()">🔄 Recarregar</button>
    </div>
  </div>

  <div class="grid-container" id="grid">
    <div class="panel" id="panel1">
      <div class="panel-bar">
        <input type="text" id="url1" value="https://poke.idleworld.online/login">
        <button class="btn btn-sm" onclick="carregar(1)">Ir</button>
        <button class="btn btn-secondary btn-sm" onclick="recarregar(1)">🔄</button>
      </div>
      <div class="iframe-wrapper">
        <iframe id="frame1" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <div class="panel" id="panel2">
      <div class="panel-bar">
        <input type="text" id="url2" value="https://poke.idleworld.online/login">
        <button class="btn btn-sm" onclick="carregar(2)">Ir</button>
        <button class="btn btn-secondary btn-sm" onclick="recarregar(2)">🔄</button>
      </div>
      <div class="iframe-wrapper">
        <iframe id="frame2" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <div class="panel" id="panel3">
      <div class="panel-bar">
        <input type="text" id="url3" value="https://poke.idleworld.online/login">
        <button class="btn btn-sm" onclick="carregar(3)">Ir</button>
        <button class="btn btn-secondary btn-sm" onclick="recarregar(3)">🔄</button>
      </div>
      <div class="iframe-wrapper">
        <iframe id="frame3" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <div class="panel" id="panel4">
      <div class="panel-bar">
        <input type="text" id="url4" value="https://poke.idleworld.online/login">
        <button class="btn btn-sm" onclick="carregar(4)">Ir</button>
        <button class="btn btn-secondary btn-sm" onclick="recarregar(4)">🔄</button>
      </div>
      <div class="iframe-wrapper">
        <iframe id="frame4" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>
  </div>

  <script>
    function formatarUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return 'https://' + url;
      }
      return url;
    }

    function carregar(id) {
      const input = document.getElementById('url' + id);
      const frame = document.getElementById('frame' + id);
      input.value = formatarUrl(input.value);
      frame.src = input.value;
    }

    function recarregar(id) {
      const frame = document.getElementById('frame' + id);
      frame.src = frame.src;
    }

    function carregarTodas() {
      const urlGlobal = formatarUrl(document.getElementById('globalUrl').value);
      for (let i = 1; i <= 4; i++) {
        document.getElementById('url' + i).value = urlGlobal;
        document.getElementById('frame' + i).src = urlGlobal;
      }
    }

    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        recarregar(i);
      }
    }

    function alterarQuantidadeTelas(qtd) {
      const grid = document.getElementById('grid');
      const qtdInt = parseInt(qtd, 10);

      // Mostra ou esconde os painéis conforme a opção selecionada
      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        if (i <= qtdInt) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
        }
      }

      // Reorganização do Grid
      if (qtdInt === 1) {
        // 1 Tela cheia
        grid.style.gridTemplateColumns = '1fr';
        grid.style.gridTemplateRows = '1fr';
      } else if (qtdInt === 2) {
        // 2 Telas divididas lado a lado (2 colunas horizontais)
        grid.style.gridTemplateColumns = '1fr 1fr';
        grid.style.gridTemplateRows = '1fr';
      } else if (qtdInt === 4) {
        // 4 Telas divididas em 4 Quadrados (2x2)
        grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
        grid.style.gridTemplateRows = 'repeat(2, 1fr)';
      }
    }
  </script>
</body>
</html>
