<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Idle Browser Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Barra de Ferramentas Superior */
    .top-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      align-items: center;
      flex-wrap: wrap;
      z-index: 100;
    }

    .top-bar input {
      flex: 1 1 180px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      min-width: 0;
    }

    .top-bar select {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #0066cc;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover { background: #0052a3; }
    .btn-secondary { background: #333; border: 1px solid #555; }
    .btn-secondary:hover { background: #444; }

    /* Grid Container */
    .grid-container {
      display: grid;
      flex: 1;
      gap: 4px;
      padding: 4px;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Modos Normais de Quantidade */
    .grid-container.qtd-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-container.qtd-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .grid-container.qtd-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
    .grid-container.qtd-4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }

    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      min-width: 0;
      min-height: 0;
      position: relative;
      transition: border-color 0.2s;
    }

    .panel.hidden {
      display: none !important;
    }

    /* Modo Destaque via CSS Grid sem alterar o DOM */
    .grid-container.has-focus {
      grid-template-rows: 4fr 1fr !important;
      grid-template-columns: repeat(3, 1fr) !important;
    }

    .grid-container.has-focus.qtd-2 {
      grid-template-columns: 1fr !important;
    }

    /* O painel em destaque ocupa o topo inteiro */
    .grid-container.has-focus .panel.focus-target {
      grid-row: 1 / 2;
      grid-column: 1 / -1;
      border: 2px solid #0066cc;
    }

    /* Painéis inativos são empurrados para a linha de baixo (Row 2) */
    .grid-container.has-focus .panel:not(.focus-target) {
      grid-row: 2 / 3;
    }

    /* Tela Cheia Absoluta */
    .panel.fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      border: none;
      border-radius: 0;
    }

    /* Grupo de Botões Flutuantes dos Painéis */
    .panel-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .btn-ctrl {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-ctrl:hover {
      background: rgba(0, 102, 204, 0.8);
      border-color: #0066cc;
    }

    /* Wrapper e Redimensionador de Renderização */
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 1280px;
      height: 720px;
      border: none;
      background: #fff;
      position: absolute;
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="globalUrl" value="https://poke.idleworld.online/login" placeholder="Digite uma URL global para todas...">
    
    <select id="screenSelect" onchange="alterarQuantidadeTelas(this.value)">
      <option value="1">1 Tela</option>
      <option value="2">2 Telas</option>
      <option value="3">3 Telas</option>
      <option value="4" selected>4 Telas</option>
    </select>

    <div class="btn-group">
      <button class="btn" onclick="carregarTodas()">Abrir em Todas</button>
      <button class="btn btn-secondary" onclick="resetarLayout()">⚖️ Igualar</button>
      <button class="btn btn-secondary" onclick="recarregarTodas()">🔄 Recarregar</button>
    </div>
  </div>

  <div class="grid-container qtd-4" id="grid">
    
    <!-- Tela 1 -->
    <div class="panel" id="panel1">
      <div class="panel-actions">
        <button class="btn-ctrl" onclick="destacarTela(1)" title="Destacar no topo">🔍 Destaque</button>
        <button class="btn-ctrl" onclick="alterarUrlSlot(1)" title="Editar URL deste slot">🔗 Link</button>
        <button class="btn-ctrl" onclick="recarregar(1)" title="Recarregar esta tela">🔄</button>
        <button class="btn-ctrl" onclick="toggleMute(1)" id="btnMute1">🔊</button>
        <button class="btn-ctrl" onclick="toggleFullscreen(1)" id="btnFull1">🗖 Tela Cheia</button>
      </div>
      <div class="iframe-wrapper" id="wrapper1">
        <iframe id="frame1" src="about:blank"></iframe>
      </div>
    </div>

    <!-- Tela 2 -->
    <div class="panel" id="panel2">
      <div class="panel-actions">
        <button class="btn-ctrl" onclick="destacarTela(2)" title="Destacar no topo">🔍 Destaque</button>
        <button class="btn-ctrl" onclick="alterarUrlSlot(2)" title="Editar URL deste slot">🔗 Link</button>
        <button class="btn-ctrl" onclick="recarregar(2)" title="Recarregar esta tela">🔄</button>
        <button class="btn-ctrl" onclick="toggleMute(2)" id="btnMute2">🔊</button>
        <button class="btn-ctrl" onclick="toggleFullscreen(2)" id="btnFull2">🗖 Tela Cheia</button>
      </div>
      <div class="iframe-wrapper" id="wrapper2">
        <iframe id="frame2" src="about:blank"></iframe>
      </div>
    </div>

    <!-- Tela 3 -->
    <div class="panel" id="panel3">
      <div class="panel-actions">
        <button class="btn-ctrl" onclick="destacarTela(3)" title="Destacar no topo">🔍 Destaque</button>
        <button class="btn-ctrl" onclick="alterarUrlSlot(3)" title="Editar URL deste slot">🔗 Link</button>
        <button class="btn-ctrl" onclick="recarregar(3)" title="Recarregar esta tela">🔄</button>
        <button class="btn-ctrl" onclick="toggleMute(3)" id="btnMute3">🔊</button>
        <button class="btn-ctrl" onclick="toggleFullscreen(3)" id="btnFull3">🗖 Tela Cheia</button>
      </div>
      <div class="iframe-wrapper" id="wrapper3">
        <iframe id="frame3" src="about:blank"></iframe>
      </div>
    </div>

    <!-- Tela 4 -->
    <div class="panel" id="panel4">
      <div class="panel-actions">
        <button class="btn-ctrl" onclick="destacarTela(4)" title="Destacar no topo">🔍 Destaque</button>
        <button class="btn-ctrl" onclick="alterarUrlSlot(4)" title="Editar URL deste slot">🔗 Link</button>
        <button class="btn-ctrl" onclick="recarregar(4)" title="Recarregar esta tela">🔄</button>
        <button class="btn-ctrl" onclick="toggleMute(4)" id="btnMute4">🔊</button>
        <button class="btn-ctrl" onclick="toggleFullscreen(4)" id="btnFull4">🗖 Tela Cheia</button>
      </div>
      <div class="iframe-wrapper" id="wrapper4">
        <iframe id="frame4" src="about:blank"></iframe>
      </div>
    </div>

  </div>

  <script>
    const URL_PADRAO = 'https://poke.idleworld.online/login';

    function formatarUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return 'https://' + url;
      }
      return url;
    }

    function carregarSlot(id, url) {
      const urlFormatada = formatarUrl(url);
      document.getElementById('frame' + id).src = urlFormatada;
      localStorage.setItem('saved_slot_' + id, urlFormatada);
    }

    function alterarUrlSlot(id) {
      const urlAtual = localStorage.getItem('saved_slot_' + id) || URL_PADRAO;
      const novaUrl = prompt(`Digite a URL para o Slot ${id}:`, urlAtual);
      if (novaUrl && novaUrl.trim() !== '') {
        carregarSlot(id, novaUrl.trim());
      }
    }

    function carregarTodas() {
      const urlGlobal = formatarUrl(document.getElementById('globalUrl').value);
      localStorage.setItem('saved_global_url', urlGlobal);
      for (let i = 1; i <= 4; i++) {
        carregarSlot(i, urlGlobal);
      }
    }

    function recarregar(id) {
      const frame = document.getElementById('frame' + id);
      frame.src = frame.src;
    }

    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        recarregar(i);
      }
    }

    function alterarQuantidadeTelas(qtd) {
      const grid = document.getElementById('grid');
      const qtdInt = parseInt(qtd, 10);
      localStorage.setItem('saved_qtd', qtd);

      resetarLayout();

      grid.className = `grid-container qtd-${qtd}`;

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        if (i <= qtdInt) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
        }
      }

      setTimeout(autoAjustarEscala, 150);
    }

    function destacarTela(idTarget) {
      const grid = document.getElementById('grid');

      // Limpa tela cheia se houver
      for (let i = 1; i <= 4; i++) {
        document.getElementById('panel' + i).classList.remove('fullscreen');
        document.getElementById('btnFull' + i).innerText = "🗖 Tela Cheia";
      }

      grid.classList.add('has-focus');

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        if (i === idTarget) {
          panel.classList.add('focus-target');
        } else {
          panel.classList.remove('focus-target');
        }
      }

      setTimeout(autoAjustarEscala, 150);
    }

    function resetarLayout() {
      const grid = document.getElementById('grid');
      grid.classList.remove('has-focus');

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        panel.classList.remove('focus-target');
        panel.classList.remove('fullscreen');
        document.getElementById('btnFull' + i).innerText = "🗖 Tela Cheia";
      }

      setTimeout(autoAjustarEscala, 150);
    }

    function toggleFullscreen(id) {
      const panel = document.getElementById('panel' + id);
      const btn = document.getElementById('btnFull' + id);

      if (panel.classList.contains('fullscreen')) {
        panel.classList.remove('fullscreen');
        btn.innerText = "🗖 Tela Cheia";
      } else {
        resetarLayout();
        panel.classList.add('fullscreen');
        btn.innerText = "🗗 Restaurar Layout";
      }

      setTimeout(autoAjustarEscala, 150);
    }

    function toggleMute(id) {
      const frame = document.getElementById('frame' + id);
      const btn = document.getElementById('btnMute' + id);

      if (frame.hasAttribute('muted')) {
        frame.removeAttribute('muted');
        btn.innerText = "🔊";
      } else {
        frame.setAttribute('muted', 'true');
        btn.innerText = "🔇";
      }
    }

    // Calcula dinamicamente o zoom/escala para não cortar nada
    function autoAjustarEscala() {
      for (let i = 1; i <= 4; i++) {
        const wrapper = document.getElementById('wrapper' + i);
        const frame = document.getElementById('frame' + i);

        if (wrapper && frame) {
          const width = wrapper.clientWidth;
          const height = wrapper.clientHeight;

          if (width > 0 && height > 0) {
            const scaleX = width / 1280;
            const scaleY = height / 720;
            const scale = Math.min(scaleX, scaleY);
            frame.style.transform = `scale(${scale})`;
          }
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedQtd = localStorage.getItem('saved_qtd') || '4';
      document.getElementById('screenSelect').value = savedQtd;
      alterarQuantidadeTelas(savedQtd);

      const savedGlobal = localStorage.getItem('saved_global_url');
      if (savedGlobal) {
        document.getElementById('globalUrl').value = savedGlobal;
      }

      for (let i = 1; i <= 4; i++) {
        const savedSlotUrl = localStorage.getItem('saved_slot_' + i);
        if (savedSlotUrl) {
          document.getElementById('frame' + i).src = savedSlotUrl;
        } else {
          carregarSlot(i, URL_PADRAO);
        }
      }

      autoAjustarEscala();
    });

    window.addEventListener('resize', autoAjustarEscala);
  </script>
</body>
</html>
