<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Idle Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Barra de Ferramentas Superior */
    .top-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      align-items: center;
      flex-wrap: wrap;
      z-index: 100;
    }

    .top-bar input {
      flex: 1 1 180px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      min-width: 0;
    }

    .top-bar select {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #0066cc;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover { background: #0052a3; }
    .btn-secondary { background: #333; border: 1px solid #555; }
    .btn-secondary:hover { background: #444; }

    /* Grid Responsivo das Telas */
    .grid-container {
      display: grid;
      flex: 1;
      gap: 4px;
      padding: 4px;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      position: relative;
    }

    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      min-width: 0;
      min-height: 0;
      position: relative;
    }

    /* Ocultar painéis inativos */
    .panel.hidden {
      display: none !important;
    }

    /* Estilo para quando um painel entra em Tela Cheia (Maximizada) */
    .panel.fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      border: none;
      border-radius: 0;
    }

    /* Botão flutuante de Maximizar/Restaurar */
    .btn-fullscreen {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(2px);
      transition: background 0.2s;
    }

    .btn-fullscreen:hover {
      background: rgba(0, 102, 204, 0.8);
      border-color: #0066cc;
    }

    /* Wrapper do iframe para renderização inteira */
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 150%;
      height: 150%;
      border: none;
      background: #fff;
      transform: scale(0.6666);
      transform-origin: 0 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="globalUrl" value="https://poke.idleworld.online/login" placeholder="Digite uma URL para todas...">
    
    <select id="screenSelect" onchange="alterarQuantidadeTelas(this.value)">
      <option value="1">1 Tela</option>
      <option value="2">2 Telas</option>
      <option value="4" selected>4 Telas</option>
    </select>

    <div class="btn-group">
      <button class="btn" onclick="carregarTodas()">Abrir em Todas</button>
      <button class="btn btn-secondary" onclick="recarregarTodas()">🔄 Recarregar</button>
    </div>
  </div>

  <div class="grid-container" id="grid">
    
    <div class="panel" id="panel1">
      <button class="btn-fullscreen" onclick="toggleFullscreen(1)" id="btnFull1">🗖 Tela Cheia</button>
      <div class="iframe-wrapper">
        <iframe id="frame1" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <div class="panel" id="panel2">
      <button class="btn-fullscreen" onclick="toggleFullscreen(2)" id="btnFull2">🗖 Tela Cheia</button>
      <div class="iframe-wrapper">
        <iframe id="frame2" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <div class="panel" id="panel3">
      <button class="btn-fullscreen" onclick="toggleFullscreen(3)" id="btnFull3">🗖 Tela Cheia</button>
      <div class="iframe-wrapper">
        <iframe id="frame3" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <div class="panel" id="panel4">
      <button class="btn-fullscreen" onclick="toggleFullscreen(4)" id="btnFull4">🗖 Tela Cheia</button>
      <div class="iframe-wrapper">
        <iframe id="frame4" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

  </div>

  <script>
    function formatarUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return 'https://' + url;
      }
      return url;
    }

    function carregarTodas() {
      const urlGlobal = formatarUrl(document.getElementById('globalUrl').value);
      for (let i = 1; i <= 4; i++) {
        document.getElementById('frame' + i).src = urlGlobal;
      }
    }

    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        const frame = document.getElementById('frame' + i);
        frame.src = frame.src;
      }
    }

    function alterarQuantidadeTelas(qtd) {
      const grid = document.getElementById('grid');
      const qtdInt = parseInt(qtd, 10);

      // Garante que se alguma tela estiver em fullscreen, reseta antes de mudar de modo
      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        panel.classList.remove('fullscreen');
        document.getElementById('btnFull' + i).innerText = "🗖 Tela Cheia";
      }

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        if (i <= qtdInt) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
        }
      }

      if (qtdInt === 1) {
        grid.style.gridTemplateColumns = '1fr';
        grid.style.gridTemplateRows = '1fr';
      } else if (qtdInt === 2) {
        grid.style.gridTemplateColumns = '1fr 1fr';
        grid.style.gridTemplateRows = '1fr';
      } else if (qtdInt === 4) {
        grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
        grid.style.gridTemplateRows = 'repeat(2, 1fr)';
      }
    }

    function toggleFullscreen(id) {
      const panel = document.getElementById('panel' + id);
      const btn = document.getElementById('btnFull' + id);

      if (panel.classList.contains('fullscreen')) {
        // Restaurar organização inicial
        panel.classList.remove('fullscreen');
        btn.innerText = "🗖 Tela Cheia";
      } else {
        // Expandir para Tela Cheia
        // Remove fullscreen de outras telas caso esteja ativo
        for (let i = 1; i <= 4; i++) {
          document.getElementById('panel' + i).classList.remove('fullscreen');
          document.getElementById('btnFull' + i).innerText = "🗖 Tela Cheia";
        }
        panel.classList.add('fullscreen');
        btn.innerText = "🗗 Restaurar Layout";
      }
    }
  </script>
</body>
</html>
