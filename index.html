<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Idle Single Window</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0d0d0d; color: #fff; font-family: sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* Barra Superior Integrada */
    .top-bar {
      display: flex; gap: 8px; padding: 6px 12px; background: #161616; border-bottom: 1px solid #2a2a2a; align-items: center;
    }
    .top-bar label { font-size: 12px; font-weight: bold; color: #0088ff; }
    .btn { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #218838; }
    .btn-fs { background: #0066cc; }
    .btn-fs:hover { background: #0052a3; }

    /* Container Grid Interno - Tudo na mesma janela */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .slot-panel {
      display: flex; flex-direction: column; background: #111; border: 1px solid #222; position: relative; overflow: hidden;
    }

    .slot-header {
      display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: #1c1c1c; font-size: 11px; border-bottom: 1px solid #2a2a2a;
    }

    .slot-header input {
      background: #2b2b2b; border: 1px solid #444; color: #fff; padding: 2px 6px; font-size: 10px; border-radius: 3px; width: 60%;
    }

    /* Iframe com atributos de isolamento de sessão */
    iframe {
      flex: 1; width: 100%; height: 100%; border: none; background: #fff;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <label>Multi-Idle App</label>
    <button class="btn" onclick="carregarTodasAsContas()">⚡ 1-Clique: Entrar em Tudo na Mesma Janela</button>
    <button class="btn btn-fs" onclick="toggleFullscreen()">🗖 Tela Cheia Unificada</button>
  </div>

  <div class="grid-container">
    
    <!-- Tela 1 -->
    <div class="slot-panel">
      <div class="slot-header">
        <span>Conta 1</span>
        <input type="text" id="url1" value="https://poke.idleworld.online/login">
      </div>
      <!-- 'sandbox' e 'name' garantem que a sessão fique isolada sem fechar as outras -->
      <iframe id="frame1" name="session_slot_1" src="about:blank"></iframe>
    </div>

    <!-- Tela 2 -->
    <div class="slot-panel">
      <div class="slot-header">
        <span>Conta 2</span>
        <input type="text" id="url2" value="https://poke.idleworld.online/login">
      </div>
      <iframe id="frame2" name="session_slot_2" src="about:blank"></iframe>
    </div>

    <!-- Tela 3 -->
    <div class="slot-panel">
      <div class="slot-header">
        <span>Conta 3</span>
        <input type="text" id="url3" value="https://poke.idleworld.online/login">
      </div>
      <iframe id="frame3" name="session_slot_3" src="about:blank"></iframe>
    </div>

    <!-- Tela 4 -->
    <div class="slot-panel">
      <div class="slot-header">
        <span>Conta 4</span>
        <input type="text" id="url4" value="https://poke.idleworld.online/login">
      </div>
      <iframe id="frame4" name="session_slot_4" src="about:blank"></iframe>
    </div>

  </div>

  <script>
    const URL_PADRAO = 'https://poke.idleworld.online/login';

    function carregarTodasAsContas() {
      for (let i = 1; i <= 4; i++) {
        const input = document.getElementById('url' + i);
        const frame = document.getElementById('frame' + i);
        const url = input.value.trim() || URL_PADRAO;

        localStorage.setItem('single_window_url_' + i, url);
        
        // Força o recarregamento na mesma janela de forma isolada
        frame.src = url;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Carrega os links salvos ao abrir o app
    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 1; i <= 4; i++) {
        const savedUrl = localStorage.getItem('single_window_url_' + i);
        if (savedUrl) {
          document.getElementById('url' + i).value = savedUrl;
        }
      }
      carregarTodasAsContas();
    });
  </script>
</body>
</html>
