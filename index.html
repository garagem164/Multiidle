<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Idle Lite Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Barra Superior Leve */
    .top-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background-color: #181818;
      border-bottom: 1px solid #2a2a2a;
      align-items: center;
      flex-wrap: wrap;
      z-index: 100;
    }

    .top-bar input {
      flex: 1 1 160px;
      background: #222;
      border: 1px solid #333;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .top-bar select {
      background: #222;
      border: 1px solid #333;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .btn {
      background: #0055b3;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover { background: #004085; }
    .btn-quick { background: #28a745; }
    .btn-quick:hover { background: #1e7e34; }
    .btn-secondary { background: #2a2a2a; border: 1px solid #444; }
    .btn-secondary:hover { background: #383838; }

    /* Grid Layout */
    .grid-container {
      display: grid;
      flex: 1;
      gap: 4px;
      padding: 4px;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .grid-container.qtd-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-container.qtd-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .grid-container.qtd-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; }
    .grid-container.qtd-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #222;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .panel.hidden {
      display: none !important;
    }

    /* Destaque Leve */
    .grid-container.has-focus {
      grid-template-rows: 3fr 1fr !important;
      grid-template-columns: repeat(3, 1fr) !important;
    }

    .grid-container.has-focus.qtd-2 { grid-template-columns: 1fr !important; }

    .grid-container.has-focus .panel.focus-target {
      grid-row: 1 / 2;
      grid-column: 1 / -1;
      border: 2px solid #0055b3;
    }

    .grid-container.has-focus .panel:not(.focus-target) {
      grid-row: 2 / 3;
    }

    .panel.fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
    }

    /* Controles dos Painéis Otimizados (Sem blur) */
    .panel-actions {
      position: absolute;
      top: 4px;
      right: 4px;
      z-index: 20;
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px;
      border-radius: 4px;
    }

    .btn-ctrl {
      background: #111;
      color: #fff;
      border: 1px solid #444;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
    }

    .btn-ctrl:hover {
      background: #0055b3;
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="globalUrl" value="https://poke.idleworld.online/login" placeholder="URL Padrão...">
    
    <select id="screenSelect" onchange="alterarQuantidadeTelas(this.value)">
      <option value="1">1 Tela</option>
      <option value="2">2 Telas</option>
      <option value="3">3 Telas</option>
      <option value="4" selected>4 Telas</option>
    </select>

    <div class="btn-group">
      <button class="btn btn-quick" onclick="entrarEmTudoComUmClique()" title="Carrega imediatamente as 4 contas salvas">⚡ 1-Clique: Entrar em Tudo</button>
      <button class="btn" onclick="carregarTodas()">Abrir Global</button>
      <button class="btn btn-secondary" onclick="resetarLayout()">⚖️ Igualar</button>
      <button class="btn btn-secondary" onclick="recarregarTodas()">🔄 Recarregar</button>
    </div>
  </div>

  <div class="grid-container qtd-4" id="grid">
    
    <!-- Slots 1 a 4 -->
    <script>
      for (let i = 1; i <= 4; i++) {
        document.write(`
          <div class="panel" id="panel${i}">
            <div class="panel-actions">
              <button class="btn-ctrl" onclick="destacarTela(${i})">🔍 Focus</button>
              <button class="btn-ctrl" onclick="alterarUrlSlot(${i})">🔗 Conta</button>
              <button class="btn-ctrl" onclick="recarregar(${i})">🔄</button>
              <button class="btn-ctrl" onclick="toggleFullscreen(${i})" id="btnFull${i}">🗖</button>
            </div>
            <div class="iframe-wrapper">
              <iframe id="frame${i}" src="about:blank" loading="lazy"></iframe>
            </div>
          </div>
        `);
      }
    </script>

  </div>

  <script>
    const URL_PADRAO = 'https://poke.idleworld.online/login';

    function formatarUrl(url) {
      if (!url) return URL_PADRAO;
      url = url.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return 'https://' + url;
      }
      return url;
    }

    function carregarSlot(id, url) {
      const urlFormatada = formatarUrl(url);
      const frame = document.getElementById('frame' + id);
      
      // Só recarrega se a URL mudar para economizar processamento
      if (frame.src !== urlFormatada) {
        frame.src = urlFormatada;
      }
      localStorage.setItem('saved_slot_' + id, urlFormatada);
    }

    function alterarUrlSlot(id) {
      const urlAtual = localStorage.getItem('saved_slot_' + id) || URL_PADRAO;
      const novaUrl = prompt(`URL/Conta salva para a Tela ${id}:`, urlAtual);
      if (novaUrl !== null) {
        carregarSlot(id, novaUrl);
      }
    }

    function entrarEmTudoComUmClique() {
      for (let i = 1; i <= 4; i++) {
        const urlSalva = localStorage.getItem('saved_slot_' + i) || URL_PADRAO;
        carregarSlot(i, urlSalva);
      }
    }

    function carregarTodas() {
      const urlGlobal = formatarUrl(document.getElementById('globalUrl').value);
      localStorage.setItem('saved_global_url', urlGlobal);
      for (let i = 1; i <= 4; i++) {
        carregarSlot(i, urlGlobal);
      }
    }

    function recarregar(id) {
      const frame = document.getElementById('frame' + id);
      frame.src = frame.src;
    }

    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        recarregar(i);
      }
    }

    function alterarQuantidadeTelas(qtd) {
      const grid = document.getElementById('grid');
      const qtdInt = parseInt(qtd, 10);
      localStorage.setItem('saved_qtd', qtd);

      resetarLayout();

      grid.className = `grid-container qtd-${qtd}`;

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        const frame = document.getElementById('frame' + i);

        if (i <= qtdInt) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
          // Pausa scripts de telas ocultas limpando o src temporariamente para economizar RAM/CPU
          frame.src = "about:blank";
        }
      }
    }

    function destacarTela(idTarget) {
      const grid = document.getElementById('grid');

      for (let i = 1; i <= 4; i++) {
        document.getElementById('panel' + i).classList.remove('fullscreen');
        document.getElementById('btnFull' + i).innerText = "🗖";
      }

      grid.classList.add('has-focus');

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        if (i === idTarget) {
          panel.classList.add('focus-target');
        } else {
          panel.classList.remove('focus-target');
        }
      }
    }

    function resetarLayout() {
      const grid = document.getElementById('grid');
      grid.classList.remove('has-focus');

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        panel.classList.remove('focus-target');
        panel.classList.remove('fullscreen');
        document.getElementById('btnFull' + i).innerText = "🗖";
      }
    }

    function toggleFullscreen(id) {
      const panel = document.getElementById('panel' + id);
      const btn = document.getElementById('btnFull' + id);

      if (panel.classList.contains('fullscreen')) {
        panel.classList.remove('fullscreen');
        btn.innerText = "🗖";
      } else {
        resetarLayout();
        panel.classList.add('fullscreen');
        btn.innerText = "🗗";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedQtd = localStorage.getItem('saved_qtd') || '4';
      document.getElementById('screenSelect').value = savedQtd;
      alterarQuantidadeTelas(savedQtd);

      const savedGlobal = localStorage.getItem('saved_global_url');
      if (savedGlobal) {
        document.getElementById('globalUrl').value = savedGlobal;
      }

      // Carrega automaticamente o último estado configurado
      entrarEmTudoComUmClique();
    });
  </script>
</body>
</html>
