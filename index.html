<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Poke Multi Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #2b2b2b;
      padding: 10px 15px;
      border-bottom: 2px solid #3d3d3d;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .btn-group { display: flex; gap: 10px; }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background-color: #45a049; }
    button:active { transform: scale(0.98); }
    button.reload { background-color: #2196F3; }
    button.reload:hover { background-color: #0b7dda; }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      flex: 1;
      background-color: #000;
      padding: 4px;
    }
    .cell {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #111;
      border: 1px solid #333;
    }
    webview { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <div class="btn-group">
      <button onclick="entrarEmTodas()">⚡ Entrar em todas as contas</button>
      <button class="reload" onclick="recarregarTodas()">🔄 Recarregar Todas</button>
    </div>
    <span style="color: #aaa; font-size: 13px;">Poke Multi Manager v1.0.0</span>
  </header>

  <div class="grid-container">
    <div class="cell"><webview id="web1" src="https://pokeidleworld.com" partition="persist:acc1"></webview></div>
    <div class="cell"><webview id="web2" src="https://pokeidleworld.com" partition="persist:acc2"></webview></div>
    <div class="cell"><webview id="web3" src="https://pokeidleworld.com" partition="persist:acc3"></webview></div>
    <div class="cell"><webview id="web4" src="https://pokeidleworld.com" partition="persist:acc4"></webview></div>
  </div>

  <script>
    const webviews = [
      document.getElementById('web1'),
      document.getElementById('web2'),
      document.getElementById('web3'),
      document.getElementById('web4')
    ];

    function entrarEmTodas() {
      webviews.forEach(wv => { wv.src = "https://pokeidleworld.com"; });
    }

    function recarregarTodas() {
      webviews.forEach(wv => { wv.reload(); });
    }
  </script>
</body>
</html>
