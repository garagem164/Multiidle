<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Idle Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Barra de Ferramentas Superior */
    .top-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      align-items: center;
      flex-wrap: wrap;
      z-index: 100;
    }

    .top-bar input {
      flex: 1 1 180px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      min-width: 0;
    }

    .top-bar select {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #0066cc;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover { background: #0052a3; }
    .btn-secondary { background: #333; border: 1px solid #555; }
    .btn-secondary:hover { background: #444; }

    /* Grid Responsivo das Telas */
    .grid-container {
      display: grid;
      flex: 1;
      gap: 4px;
      padding: 4px;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      position: relative;
    }

    .panel {
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      min-width: 0;
      min-height: 0;
      position: relative;
    }

    .panel.hidden {
      display: none !important;
    }

    .panel.fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      border: none;
      border-radius: 0;
    }

    /* Bar com Controles de Auto Click e Fullscreen */
    .panel-controls {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .autoclick-bar {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.75);
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
      align-items: center;
    }

    .autoclick-bar input {
      width: 45px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 2px;
      text-align: center;
    }

    .btn-ctrl {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      backdrop-filter: blur(2px);
      pointer-events: auto;
    }

    .btn-ctrl:hover {
      background: rgba(0, 102, 204, 0.8);
      border-color: #0066cc;
    }

    .btn-active {
      background: #28a745 !important;
      border-color: #1e7e34 !important;
    }

    /* Overlay para Captura e Execução de Cliques */
    .click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      display: none;
      cursor: crosshair;
      background: rgba(0, 102, 204, 0.15);
    }

    .click-target-marker {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #ff0000;
      border-radius: 50%;
      background: rgba(255, 0, 0, 0.4);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 18;
      display: none;
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    iframe {
      width: 150%;
      height: 150%;
      border: none;
      background: #fff;
      transform: scale(0.6666);
      transform-origin: 0 0;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="globalUrl" value="https://poke.idleworld.online/login" placeholder="Digite uma URL para todas...">
    
    <select id="screenSelect" onchange="alterarQuantidadeTelas(this.value)">
      <option value="1">1 Tela</option>
      <option value="2">2 Telas</option>
      <option value="4" selected>4 Telas</option>
    </select>

    <div class="btn-group">
      <button class="btn" onclick="carregarTodas()">Abrir em Todas</button>
      <button class="btn btn-secondary" onclick="recarregarTodas()">🔄 Recarregar</button>
    </div>
  </div>

  <div class="grid-container" id="grid">
    
    <!-- Tela 1 -->
    <div class="panel" id="panel1">
      <div class="panel-controls">
        <div class="autoclick-bar">
          <button class="btn-ctrl" id="btnTarget1" onclick="definirAlvo(1)">🎯 Alvo</button>
          <input type="number" id="freq1" value="1" min="0.1" step="0.5" title="Intervalo em segundos">
          <span style="font-size: 10px;">s</span>
          <button class="btn-ctrl" id="btnStart1" onclick="toggleAutoClick(1)">▶ Auto</button>
        </div>
        <button class="btn-ctrl" onclick="toggleFullscreen(1)" id="btnFull1">🗖 Tela Cheia</button>
      </div>
      <div class="click-overlay" id="overlay1" onclick="marcarAlvo(event, 1)"></div>
      <div class="click-target-marker" id="marker1"></div>
      <div class="iframe-wrapper">
        <iframe id="frame1" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <!-- Tela 2 -->
    <div class="panel" id="panel2">
      <div class="panel-controls">
        <div class="autoclick-bar">
          <button class="btn-ctrl" id="btnTarget2" onclick="definirAlvo(2)">🎯 Alvo</button>
          <input type="number" id="freq2" value="1" min="0.1" step="0.5" title="Intervalo em segundos">
          <span style="font-size: 10px;">s</span>
          <button class="btn-ctrl" id="btnStart2" onclick="toggleAutoClick(2)">▶ Auto</button>
        </div>
        <button class="btn-ctrl" onclick="toggleFullscreen(2)" id="btnFull2">🗖 Tela Cheia</button>
      </div>
      <div class="click-overlay" id="overlay2" onclick="marcarAlvo(event, 2)"></div>
      <div class="click-target-marker" id="marker2"></div>
      <div class="iframe-wrapper">
        <iframe id="frame2" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <!-- Tela 3 -->
    <div class="panel" id="panel3">
      <div class="panel-controls">
        <div class="autoclick-bar">
          <button class="btn-ctrl" id="btnTarget3" onclick="definirAlvo(3)">🎯 Alvo</button>
          <input type="number" id="freq3" value="1" min="0.1" step="0.5" title="Intervalo em segundos">
          <span style="font-size: 10px;">s</span>
          <button class="btn-ctrl" id="btnStart3" onclick="toggleAutoClick(3)">▶ Auto</button>
        </div>
        <button class="btn-ctrl" onclick="toggleFullscreen(3)" id="btnFull3">🗖 Tela Cheia</button>
      </div>
      <div class="click-overlay" id="overlay3" onclick="marcarAlvo(event, 3)"></div>
      <div class="click-target-marker" id="marker3"></div>
      <div class="iframe-wrapper">
        <iframe id="frame3" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

    <!-- Tela 4 -->
    <div class="panel" id="panel4">
      <div class="panel-controls">
        <div class="autoclick-bar">
          <button class="btn-ctrl" id="btnTarget4" onclick="definirAlvo(4)">🎯 Alvo</button>
          <input type="number" id="freq4" value="1" min="0.1" step="0.5" title="Intervalo em segundos">
          <span style="font-size: 10px;">s</span>
          <button class="btn-ctrl" id="btnStart4" onclick="toggleAutoClick(4)">▶ Auto</button>
        </div>
        <button class="btn-ctrl" onclick="toggleFullscreen(4)" id="btnFull4">🗖 Tela Cheia</button>
      </div>
      <div class="click-overlay" id="overlay4" onclick="marcarAlvo(event, 4)"></div>
      <div class="click-target-marker" id="marker4"></div>
      <div class="iframe-wrapper">
        <iframe id="frame4" src="https://poke.idleworld.online/login"></iframe>
      </div>
    </div>

  </div>

  <script>
    // Armazena as coordenadas e intervalos independentes de cada tela
    const autoClickers = {
      1: { x: null, y: null, interval: null, running: false },
      2: { x: null, y: null, interval: null, running: false },
      3: { x: null, y: null, interval: null, running: false },
      4: { x: null, y: null, interval: null, running: false }
    };

    function formatarUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        return 'https://' + url;
      }
      return url;
    }

    function carregarTodas() {
      const urlGlobal = formatarUrl(document.getElementById('globalUrl').value);
      for (let i = 1; i <= 4; i++) {
        document.getElementById('frame' + i).src = urlGlobal;
      }
    }

    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        const frame = document.getElementById('frame' + i);
        frame.src = frame.src;
      }
    }

    function alterarQuantidadeTelas(qtd) {
      const grid = document.getElementById('grid');
      const qtdInt = parseInt(qtd, 10);

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        panel.classList.remove('fullscreen');
        document.getElementById('btnFull' + i).innerText = "🗖 Tela Cheia";
      }

      for (let i = 1; i <= 4; i++) {
        const panel = document.getElementById('panel' + i);
        if (i <= qtdInt) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
          pararAutoClick(i);
        }
      }

      if (qtdInt === 1) {
        grid.style.gridTemplateColumns = '1fr';
        grid.style.gridTemplateRows = '1fr';
      } else if (qtdInt === 2) {
        grid.style.gridTemplateColumns = '1fr 1fr';
        grid.style.gridTemplateRows = '1fr';
      } else if (qtdInt === 4) {
        grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
        grid.style.gridTemplateRows = 'repeat(2, 1fr)';
      }
    }

    function toggleFullscreen(id) {
      const panel = document.getElementById('panel' + id);
      const btn = document.getElementById('btnFull' + id);

      if (panel.classList.contains('fullscreen')) {
        panel.classList.remove('fullscreen');
        btn.innerText = "🗖 Tela Cheia";
      } else {
        for (let i = 1; i <= 4; i++) {
          document.getElementById('panel' + i).classList.remove('fullscreen');
          document.getElementById('btnFull' + i).innerText = "🗖 Tela Cheia";
        }
        panel.classList.add('fullscreen');
        btn.innerText = "🗗 Restaurar Layout";
      }
    }

    // LÓGICA DO AUTO CLICKER INDIVIDUAL

    function definirAlvo(id) {
      const overlay = document.getElementById('overlay' + id);
      overlay.style.display = 'block';
    }

    function marcarAlvo(event, id) {
      const overlay = document.getElementById('overlay' + id);
      const marker = document.getElementById('marker' + id);
      const rect = overlay.getBoundingClientRect();

      // Armazena as coordenadas do clique relativas ao painel
      autoClickers[id].x = event.clientX - rect.left;
      autoClickers[id].y = event.clientY - rect.top;

      // Posiciona a mira visual no local selecionado
      marker.style.left = autoClickers[id].x + 'px';
      marker.style.top = autoClickers[id].y + 'px';
      marker.style.display = 'block';

      // Oculta o overlay interativo para voltar a acessar o jogo normalmente
      overlay.style.display = 'none';
    }

    function toggleAutoClick(id) {
      const state = autoClickers[id];
      if (state.running) {
        pararAutoClick(id);
      } else {
        iniciarAutoClick(id);
      }
    }

    function iniciarAutoClick(id) {
      const state = autoClickers[id];

      if (state.x === null || state.y === null) {
        alert('Defina o alvo clicando em "🎯 Alvo" primeiro.');
        return;
      }

      const freqInput = document.getElementById('freq' + id);
      const tempoMs = parseFloat(freqInput.value) * 1000;

      if (isNaN(tempoMs) || tempoMs < 100) {
        alert('Defina um tempo válido igual ou superior a 0.1s.');
        return;
      }

      state.running = true;
      const btnStart = document.getElementById('btnStart' + id);
      btnStart.innerText = '⏸ Parar';
      btnStart.classList.add('btn-active');

      // Executa o disparo inicial e agenda a repetição
      dispararClique(id);
      state.interval = setInterval(() => dispararClique(id), tempoMs);
    }

    function pararAutoClick(id) {
      const state = autoClickers[id];
      if (state.interval) {
        clearInterval(state.interval);
        state.interval = null;
      }
      state.running = false;

      const btnStart = document.getElementById('btnStart' + id);
      if (btnStart) {
        btnStart.innerText = '▶ Auto';
        btnStart.classList.remove('btn-active');
      }
    }

    function dispararClique(id) {
      const state = autoClickers[id];
      if (state.x === null || state.y === null) return;

      const panel = document.getElementById('panel' + id);
      
      // Simula a animação visual de clique na posição do alvo
      const clickRipple = document.createElement('div');
      clickRipple.style.position = 'absolute';
      clickRipple.style.left = state.x + 'px';
      clickRipple.style.top = state.y + 'px';
      clickRipple.style.width = '20px';
      clickRipple.style.height = '20px';
      clickRipple.style.borderRadius = '50%';
      clickRipple.style.border = '2px solid #00ff00';
      clickRipple.style.transform = 'translate(-50%, -50%)';
      clickRipple.style.pointerEvents = 'none';
      clickRipple.style.zIndex = '30';
      
      panel.appendChild(clickRipple);

      // Dispara os eventos padrão de Pointer/Mouse na coordenada indicada
      const targetElement = document.elementFromPoint(
        panel.getBoundingClientRect().left + state.x,
        panel.getBoundingClientRect().top + state.y
      ) || panel;

      targetElement.dispatchEvent(new MouseEvent('click', {
        bubbles: true,
        cancelable: true,
        clientX: panel.getBoundingClientRect().left + state.x,
        clientY: panel.getBoundingClientRect().top + state.y
      }));

      setTimeout(() => {
        if (clickRipple.parentNode) {
          clickRipple.parentNode.removeChild(clickRipple);
        }
      }, 300);
    }
  </script>
</body>
</html>
