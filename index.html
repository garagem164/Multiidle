<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Poke Multi Manager</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #121214;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .toolbar {
      height: 45px;
      background: #202024;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
    }

    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    button:hover {
      background: #4338ca;
    }

    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      background: #000;
      width: 100%;
      height: calc(100vh - 45px);
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      background: #18181b;
      overflow: hidden;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button onclick="recarregarTodas()">Recarregar Todas</button>
  </div>

  <div class="grid-container">
    <div class="card">
      <webview id="view1" src="https://pokeidle.net" partition="persist:acc1" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
    </div>
    <div class="card">
      <webview id="view2" src="https://pokeidle.net" partition="persist:acc2" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
    </div>
    <div class="card">
      <webview id="view3" src="https://pokeidle.net" partition="persist:acc3" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
    </div>
    <div class="card">
      <webview id="view4" src="https://pokeidle.net" partition="persist:acc4" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
    </div>
  </div>

  <script>
    function recarregarTodas() {
      for (let i = 1; i <= 4; i++) {
        const wv = document.getElementById(`view${i}`);
        if (wv) wv.reload();
      }
    }
  </script>
</body>
</html>
